---
# Adds the Zabbly Incus stable apt repository, installs Incus and its
# web UI (incus-ui-canonical) from it, then performs a one-time
# non-interactive initialization (btrfs storage pool backed by a
# dedicated subvolume at /var/lib/incus-pool on the system disk,
# entirely separate from /var/lib/incus itself; incusbr0 bridge network;
# HTTPS API listener) if Incus has not already been initialized on this
# host. Debian's own repo only ships a plain `incus` package with no
# separate UI package, so Zabbly's repo is used instead to get
# incus-ui-canonical.
- name: Install and configure Incus with web UI
  hosts: myhosts
  become: true

  tasks:
    - name: Ensure /etc/apt/keyrings exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add the Zabbly apt signing key
      ansible.builtin.get_url:
        url: https://pkgs.zabbly.com/key.asc
        dest: /etc/apt/keyrings/zabbly.asc
        mode: "0644"

    - name: Add the Zabbly Incus stable apt repository
      ansible.builtin.template:
        src: zabbly-incus-stable.sources.j2
        dest: /etc/apt/sources.list.d/zabbly-incus-stable.sources
        mode: "0644"

    - name: Ensure Incus and its web UI are installed from Zabbly
      ansible.builtin.apt:
        name:
          - incus
          - incus-client
          - incus-ui-canonical
        state: present
        update_cache: true

    - name: Ensure {{ ansible_user }} is in the incus-admin group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: incus-admin
        append: true

    - name: Ensure the Incus service is enabled and running
      ansible.builtin.systemd:
        name: incus.service
        enabled: true
        state: started

    - name: Check whether Incus has already been initialized
      ansible.builtin.command: incus storage list -f json
      register: incus_storage_pools
      changed_when: false

    - name: Check whether the storage pool subvolume already exists
      ansible.builtin.command: btrfs subvolume show /var/lib/incus-pool
      register: incus_subvolume_check
      changed_when: false
      failed_when: false
      when: (incus_storage_pools.stdout | from_json | length) == 0

    # The pool's source must be a location entirely separate from /var/lib/incus
    # (Incus's own data/state directory), not nested under it. Nesting the pool
    # under /var/lib/incus (even as its own subvolume, e.g.
    # /var/lib/incus/storage-pools/default) causes Incus to bind-mount that
    # subvolume a second time inside itself, aliasing the daemon's own database/
    # certs/sockets into the pool path and corrupting things. See
    # incus-preseed.yml.j2.
    - name: Create a dedicated BTRFS subvolume for the default storage pool
      ansible.builtin.command: btrfs subvolume create /var/lib/incus-pool
      when:
        - (incus_storage_pools.stdout | from_json | length) == 0
        - incus_subvolume_check.rc != 0

    - name: Initialize Incus (preseed)
      ansible.builtin.command: incus admin init --preseed
      args:
        stdin: "{{ lookup('template', 'incus-preseed.yml.j2') }}"
      when: (incus_storage_pools.stdout | from_json | length) == 0

    - name: Check whether the incusbr0 network already exists
      ansible.builtin.command: incus network list -f json
      register: incus_networks
      changed_when: false

    # Guards independently of the storage-pool check above, since preseed
    # init only runs once ever (skipped once a storage pool already exists
    # from an earlier partial run) — without this, a host that got its
    # storage pool created but never its network (as happened in practice)
    # would be stuck with no bridge forever.
    - name: Create the incusbr0 bridge network
      ansible.builtin.command: incus network create incusbr0
      when: "'incusbr0' not in (incus_networks.stdout | from_json | map(attribute='name') | list)"

    - name: Check whether the default profile already has an eth0 device
      ansible.builtin.command: incus profile show default
      register: incus_default_profile
      changed_when: false

    - name: Add the eth0 nic device to the default profile
      ansible.builtin.command: incus profile device add default eth0 nic network=incusbr0
      when: "'eth0' not in (incus_default_profile.stdout | from_yaml).devices"

    - name: Read the current Incus HTTPS API address
      ansible.builtin.command: incus config get core.https_address
      register: incus_https_address_current
      changed_when: false

    - name: Activate the Incus HTTPS API
      ansible.builtin.command: incus config set core.https_address {{ incus_https_address }}
      when: incus_https_address_current.stdout != incus_https_address

    - name: Check whether the laptop client is already trusted
      ansible.builtin.command: incus config trust list -f json
      register: incus_trusts
      changed_when: false

    - name: Generate a one-time trust token for adding the laptop as a remote client
      ansible.builtin.command: incus config trust add "{{ ansible_user }}-client"
      register: incus_trust_token
      when: (ansible_user ~ '-client') not in (incus_trusts.stdout | from_json | map(attribute='name') | list)

    - name: Show the trust token (use it with 'incus remote add' from a client)
      ansible.builtin.debug:
        msg: "{{ incus_trust_token.stdout }}"
      when: incus_trust_token is not skipped

    - name: Check whether the docker remote is already configured
      ansible.builtin.command: incus remote list -f json
      become_user: "{{ ansible_user }}"
      register: incus_remotes
      changed_when: false

    - name: Add the Docker Hub OCI remote
      ansible.builtin.command: incus remote add docker https://docker.io --protocol=oci
      become_user: "{{ ansible_user }}"
      when: "'docker' not in (incus_remotes.stdout | from_json)"

    - name: Add the GitHub Container Registry OCI remote
      ansible.builtin.command: incus remote add ghcr https://ghcr.io --protocol=oci
      become_user: "{{ ansible_user }}"
      when: "'ghcr' not in (incus_remotes.stdout | from_json)"

    - name: Add the GitLab Container Registry OCI remote
      ansible.builtin.command: incus remote add gitlab https://registry.gitlab.com --protocol=oci
      become_user: "{{ ansible_user }}"
      when: "'gitlab' not in (incus_remotes.stdout | from_json)"
