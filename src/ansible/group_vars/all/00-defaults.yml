---
# Defaults, committed to git. Real per-host values (disk serials) live in
# the gitignored 01-local.yml in this same directory, which is merged on
# top of this file (Ansible loads group_vars/all/*.yml alphabetically).
#
# Stable by-id paths for the two disks that make up the existing BTRFS
# RAID1 "naspool" volume. Find the real values on the homelab with:
#   ls -l /dev/disk/by-id/ | grep -v part
# Pick the whole-disk entries (not the ones ending in -partN) for the two
# physical disks that belong to naspool.
naspool_disks:
  - /dev/disk/by-id/CHANGEME-disk1
  - /dev/disk/by-id/CHANGEME-disk2

naspool_mount_point: /naspool

# Address:port the Incus HTTPS API (and its web UI) listens on. 0.0.0.0
# exposes it on every interface, so it's reachable at
# https://<homelab-ip>:8443 from the laptop.
incus_https_address: "0.0.0.0:8443"

# Address:port the Incus storage buckets (S3-compatible) API listens on.
# 0.0.0.0 exposes it on every interface, so S3 clients can reach it at
# https://<homelab-ip>:8555 from the LAN. Gates whether any Incus storage
# pool can host buckets at all (see naspool-buckets.yml and
# src/opentofu/naspool-buckets.tf).
incus_storage_buckets_address: "0.0.0.0:8555"

# Public DNS name for the headscale controller, registered on duckdns.org.
# Used as headscale's server_url and as the Caddy site address (Caddy
# issues/renews its Let's Encrypt certificate for this name automatically).
# Must resolve to this container's public IPv6 (see the "headscale" section
# in references/INSTALL.md for the manual DuckDNS + router steps).
headscale_domain: <headscale-domain>

# STUN port for headscale's embedded DERP relay (NAT traversal between
# tailnet clients). Must be forwarded on the router, see INSTALL.md.
headscale_derp_stun_port: 3478

# Pinned headscale release version (no apt repo exists; installed from the
# .deb published on the GitHub releases page). Headscale enforces a strict
# upgrade path — it refuses to start if you skip a minor version against an
# existing database, and pre-0.25.0 databases aren't supported by 0.28.0+'s
# migrations at all. Bump one minor version at a time (latest patch of each),
# re-running the playbook and confirming `headscale version` + `systemctl
# status headscale` after each hop, rather than jumping straight to the
# latest release: https://github.com/juanfont/headscale/releases
headscale_version: "0.29.2"

# Headscale users to create (namespaces that tailnet nodes register under).
# Override this list in the gitignored 01-local.yml with your real usernames
# — kept out of git since it's personal/account data, not infrastructure.
headscale_users: []

# Pinned headplane (headscale web UI) release tag — built from source (no
# prebuilt binary/tarball exists upstream, only Docker images or source).
# https://github.com/tale/headplane/releases
headplane_version: "0.7.0"

# Where headplane's cloned/built source tree lives on the container.
headplane_install_dir: /opt/headplane

# Node.js major version installed via the NodeSource apt repo (Debian 12's
# own apt repo only ships Node 18, too old for headplane). Pinned to 24 per
# headplane v0.7.0's package.json "engines" field (its own native-mode docs
# say 22.16.x, an inconsistency with the manifest — bump this if pnpm's
# engines check rejects 24.x in practice).
headplane_node_major: "24"

# Port headplane's Node server listens on (loopback only; Caddy reverse-
# proxies /admin/* to this port — see templates/Caddyfile.j2).
headplane_port: 3000

# Headscale user the homelab host itself registers under when joining its
# own tailnet (see tailscale.yml) — must be one of the names already listed
# in headscale_users (real values in the gitignored 01-local.yml).
tailscale_headscale_user: luis

# Samba/Linux users created on the "naspool-samba" instance (see naspool.tf and
# samba.yml), each with read/write access to the single [naspool] share.
# Override in the gitignored 01-local.yml with real usernames, alongside a
# parallel samba_passwords map keyed by username, e.g.:
#   samba_users: ["luis"]
#   samba_passwords:
#     luis: "CHANGEME"
# Kept out of git since it's personal/account data, not infrastructure —
# same reasoning as headscale_users above.
samba_users: []

# Host paths bind-mounted into the Immich OCI instances (see immich.yml),
# all under /naspool rather than the system disk — same reasoning as the
# naspool-samba/naspool-buckets data: it's durable, RAID1-protected
# storage, and the actual photo library/database are worth protecting
# that way (the model-cache is re-downloadable and low-value, but kept
# alongside the others for consistency).
immich_upload_dir: /naspool/immich/upload
immich_postgres_dir: /naspool/immich/postgres
immich_model_cache_dir: /naspool/immich/model-cache

# Host-side base of the "immich" Incus project's unprivileged UID/GID
# shift, confirmed identical across every instance in the project (it's
# assigned per-project, not per-instance) via `incus config get
# <instance> volatile.idmap.current --project immich`. Used to chown
# immich.yml's bind-mounted data directories to <this base> + <the
# in-container UID the process actually runs as> — a plain bind mount
# doesn't remap ownership, and shift=true/raw.idmap are both rejected by
# Incus for this project (see immich.yml's chown tasks for the full
# story), so pre-chowning the host path is the only remaining option.
immich_idmap_base: 1000000

# Postgres database/user name for the "immich-db" OCI instance (see
# immich.yml). The password is deliberately not defaulted here — it's set
# in the gitignored 01-local.yml as immich_db_password, same convention as
# samba_passwords above, e.g.:
#   immich_db_password: "CHANGEME"
immich_db_name: immich
immich_db_username: immich

# Pinned Immich release version, matching across the server and
# machine-learning images since Immich requires both on the same release.
# Bump, re-run immich.yml, and check the Immich release notes for any
# required migration steps. https://github.com/immich-app/immich/releases
immich_version: release

# Immich's own Postgres image (VectorChord + pgvector bundled), versioned
# independently of immich_version above since it changes far less often —
# check https://github.com/immich-app/immich/blob/main/docker-compose.yml
# for the version pairing before bumping either one on its own. Prefixed
# with the "ghcr:" OCI remote (see incus.yml) since this image lives on
# ghcr.io, unlike valkey's docker.io.
immich_postgres_image: "ghcr:immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0"

# --- Media stack (Jellyfin, Navidrome, Kavita — see media.yml/media.tf) ---

# The pre-existing media library on /naspool, already exported read-write
# over Samba by naspool-samba. The media services mount subdirectories of
# this READ-ONLY (readonly=true on each disk device) — Samba stays the only
# writer, so a misbehaving service can't corrupt the archive. Nothing here
# is created or chowned by media.yml, unlike the Immich directories above.
media_library_root: /naspool/biblioteca

media_filmes_dir: "{{ media_library_root }}/Filmes"
media_videos_dir: "{{ media_library_root }}/Videos"
media_musicas_dir: "{{ media_library_root }}/Musicas"
media_livros_dir: "{{ media_library_root }}/Livros"
# Note the space in this one — every `incus config device add` using it
# has to quote it (see media.yml's navidrome tasks).
media_itunes_dir: "{{ media_library_root }}/Biblioteca iTunes"

# Writable config/cache/database directories for the three services,
# deliberately on a separate tree from media_library_root above so no
# service ever writes inside the library it indexes. Created and chowned
# by media.yml (unlike the library itself).
media_config_root: /naspool/media

jellyfin_config_dir: "{{ media_config_root }}/jellyfin/config"
jellyfin_cache_dir: "{{ media_config_root }}/jellyfin/cache"
navidrome_data_dir: "{{ media_config_root }}/navidrome/data"
kavita_config_dir: "{{ media_config_root }}/kavita/config"

# Host-side base of the "media" Incus project's unprivileged UID/GID shift.
# Assigned per-project, NOT global — this happens to match Immich's
# immich_idmap_base but must not be assumed to: verify with
#   incus config get jellyfin volatile.idmap.current --project media
# and update this if the "Hostid" reported there differs.
#
# Unlike Immich (postgres=999, node=1000), all three media images run their
# processes as root (uid/gid 0) in-container — verified by launching each
# image throwaway and running `id`. So the writable directories above are
# chowned to exactly this base + 0, with no per-service offset.
#
# The read-only library mounts need no chown at all: /naspool/biblioteca is
# already world-readable (dirs drwxr-xr-x, files -rw-r--r--), so the
# shifted root can traverse and read it as-is — and chowning it would
# rewrite the ownership of the user's own Samba archive.
media_idmap_base: 1000000

# Ports each service's web UI listens on inside its container, forwarded to
# the homelab host (and so to the LAN and tailnet, same as Immich's 2283)
# by a proxy device per instance.
jellyfin_port: 8096
navidrome_port: 4533
kavita_port: 5000

# OCI images for the three services. Jellyfin's official image is on
# ghcr.io; the other two publish to docker.io — both remotes are already
# configured by incus.yml under luis's own client config.
jellyfin_image: "ghcr:jellyfin/jellyfin"

# PCI address of the GPU passed to jellyfin for QuickSync hardware
# transcoding — this homelab's only GPU is the Intel Gemini Lake iGPU
# (UHD Graphics 605, [8086:3184]) at 0000:00:02.0. Find it on a new host
# with `lspci -nn | grep -i vga`, or by following /dev/dri/by-path/*-render.
#
# Selected by PCI address rather than Incus's `id=` property: `id` means
# the DRM *card number* ("0" for card0), not the render node filename, so
# `id=renderD128` fails at instance start with "Failed to detect requested
# GPU device" (confirmed in practice). `pci=` is unambiguous either way.
jellyfin_gpu_pci: "0000:00:02.0"
navidrome_image: "docker:deluan/navidrome:latest"
kavita_image: "docker:jvmilazz0/kavita:latest"

# --- Coolify (see coolify.yml/coolify.tf) ---

# Coolify is an evaluation scratchpad, not a place to run anything
# permanent — see coolify.tf's header. The control plane lives in the
# "coolify" instance; apps get deployed onto the sandbox instances below.

# Host-facing port for Coolify's web UI, forwarded by the "coolify-web"
# proxy device declared in coolify.tf. Coolify's realtime websocket ports
# (6001/6002) are deliberately NOT forwarded — see that file.
coolify_port: 8000

# The sandbox "remote servers" Coolify deploys onto. Each one gets sshd,
# Docker, and Coolify's own public key in root's authorized_keys. Adding a
# second is this list plus a matching incus_instance in coolify.tf.
coolify_sandboxes:
  - coolify-sandbox

# Subnet pool Coolify hands out to the per-app Docker networks it creates.
#
# This MUST be overridden. Coolify's own default is 10.0.0.0/8, which
# contains every Incus bridge on this host — immich-br0 (10.10.10.0/24),
# media-br0 (10.10.20.0/24), coolify-br0 (10.10.30.0/24) and incusbr0
# (10.183.191.0/24). Docker only carves out a /24 at a time, as apps are
# created, so the collision wouldn't appear at install: it would surface
# much later as one of those bridges mysteriously breaking, with nothing
# obviously connecting it to Coolify.
#
# 10.99.0.0/16 is clear of all of them and still leaves 256 /24s for apps.
# Written into /data/coolify/source/.env BEFORE the installer first runs,
# so no 10.0.0.0/8 network is ever created even momentarily.
coolify_network_pool: "10.99.0.0/16"
coolify_network_pool_size: 24

# Same idea for the sandbox servers, but a DIFFERENT /16 — the control
# plane and the sandbox each run their own Docker daemon, and each hands
# out subnets from its own pool with no knowledge of the other. Sharing one
# range would eventually have both allocate the same subnet, which breaks
# routing between them in ways that look like random connectivity loss.
#
# Unlike the control plane's, this one isn't fixing a collision: Docker's
# own default (172.16.0.0/12) doesn't overlap anything on this host. It's
# fixing the *size* — Docker's default carves out a /16 per network, and
# Coolify creates one per project, so the default pool runs dry after ~16
# projects with an opaque "no available non-overlapping IPv4 address pool"
# error mid-deploy. A /24 size gives 256 instead.
coolify_sandbox_network_pool: "10.98.0.0/16"
