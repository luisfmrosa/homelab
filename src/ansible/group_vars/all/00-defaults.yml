---
# Defaults, committed to git. Real per-host values (disk serials) live in
# the gitignored 01-local.yml in this same directory, which is merged on
# top of this file (Ansible loads group_vars/all/*.yml alphabetically).
#
# Stable by-id paths for the two disks that make up the existing BTRFS
# RAID1 "naspool" volume. Find the real values on the homelab with:
#   ls -l /dev/disk/by-id/ | grep -v part
# Pick the whole-disk entries (not the ones ending in -partN) for the two
# physical disks that belong to naspool.
naspool_disks:
  - /dev/disk/by-id/CHANGEME-disk1
  - /dev/disk/by-id/CHANGEME-disk2

naspool_mount_point: /naspool

# Address:port the Incus HTTPS API (and its web UI) listens on. 0.0.0.0
# exposes it on every interface, so it's reachable at
# https://<homelab-ip>:8443 from the laptop.
incus_https_address: "0.0.0.0:8443"

# Public DNS name for the headscale controller, registered on duckdns.org.
# Used as headscale's server_url and as the Caddy site address (Caddy
# issues/renews its Let's Encrypt certificate for this name automatically).
# Must resolve to this container's public IPv6 (see the "headscale" section
# in references/INSTALL.md for the manual DuckDNS + router steps).
headscale_domain: <headscale-domain>

# STUN port for headscale's embedded DERP relay (NAT traversal between
# tailnet clients). Must be forwarded on the router, see INSTALL.md.
headscale_derp_stun_port: 3478

# Pinned headscale release version (no apt repo exists; installed from the
# .deb published on the GitHub releases page). Headscale enforces a strict
# upgrade path — it refuses to start if you skip a minor version against an
# existing database, and pre-0.25.0 databases aren't supported by 0.28.0+'s
# migrations at all. Bump one minor version at a time (latest patch of each),
# re-running the playbook and confirming `headscale version` + `systemctl
# status headscale` after each hop, rather than jumping straight to the
# latest release: https://github.com/juanfont/headscale/releases
headscale_version: "0.29.2"

# Headscale users to create (namespaces that tailnet nodes register under).
# Override this list in the gitignored 01-local.yml with your real usernames
# — kept out of git since it's personal/account data, not infrastructure.
headscale_users: []

# Pinned headplane (headscale web UI) release tag — built from source (no
# prebuilt binary/tarball exists upstream, only Docker images or source).
# https://github.com/tale/headplane/releases
headplane_version: "0.7.0"

# Where headplane's cloned/built source tree lives on the container.
headplane_install_dir: /opt/headplane

# Node.js major version installed via the NodeSource apt repo (Debian 12's
# own apt repo only ships Node 18, too old for headplane). Pinned to 24 per
# headplane v0.7.0's package.json "engines" field (its own native-mode docs
# say 22.16.x, an inconsistency with the manifest — bump this if pnpm's
# engines check rejects 24.x in practice).
headplane_node_major: "24"

# Port headplane's Node server listens on (loopback only; Caddy reverse-
# proxies /admin/* to this port — see templates/Caddyfile.j2).
headplane_port: 3000

# Headscale user the homelab host itself registers under when joining its
# own tailnet (see tailscale.yml) — must be one of the names already listed
# in headscale_users (real values in the gitignored 01-local.yml).
tailscale_headscale_user: luis

# Samba/Linux users created on the "naspool-samba" instance (see naspool.tf and
# samba.yml), each with read/write access to the single [naspool] share.
# Override in the gitignored 01-local.yml with real usernames, alongside a
# parallel samba_passwords map keyed by username, e.g.:
#   samba_users: ["luis"]
#   samba_passwords:
#     luis: "CHANGEME"
# Kept out of git since it's personal/account data, not infrastructure —
# same reasoning as headscale_users above.
samba_users: []
